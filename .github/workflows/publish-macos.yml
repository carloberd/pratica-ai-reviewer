name: Build macOS Release

on:
  release:
    types: [published]
  workflow_dispatch:

# Mai due build per lo stesso ref insieme, ma una build di release in corso deve
# arrivare in fondo: annullarla lascerebbe la release senza allegati.
concurrency:
  group: publish-macos-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # serve per allegare i pacchetti alla GitHub Release

jobs:
  build-macos:
    # Runner arm64. Da qui electron-builder produce entrambe le architetture:
    # per la x64 scarica l'Electron corrispondente, non serve un runner Intel.
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Prima pnpm, poi setup-node: la cache di setup-node ha bisogno di trovarlo
      # già installato. La versione arriva dal campo `packageManager`.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Il postinstall lancia @electron/rebuild su better-sqlite3. Con i prebuild
      # N-API di better-sqlite3 13 è quasi sempre un no-op, ma resta la rete di
      # sicurezza se un giorno servisse una compilazione vera.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Nessuna credenziale Google e nessuna rete: Drive è mockato sulle fixture e
      # l'OCR gira sui modelli versionati in resources/tessdata.
      - name: Run test suite
        run: pnpm test

      - name: Read version from package.json
        id: package-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Il nome dell'artefatto contiene la versione di package.json, non il tag: se
      # i due divergono la release finirebbe con allegati che dichiarano la versione
      # sbagliata. Meglio fermarsi qui e dirlo.
      - name: Check the tag matches package.json
        if: github.event_name == 'release'
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${{ steps.package-version.outputs.version }}"
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Il tag $TAG non corrisponde alla versione $VERSION di package.json. Allinea package.json e ricrea il tag."
            exit 1
          fi

      # `identity: null` in electron-builder.yml salta la firma: non ci sono
      # certificati in CI e i pacchetti sono per due macchine conosciute. Al primo
      # avvio macOS chiede conferma.
      # Le credenziali OAuth vengono cucite nel bundle del main a build time. Una
      # release senza non riuscirebbe a fare login, ed è peggio di una build fallita:
      # meglio fermarsi qui. Su una run manuale restano facoltative.
      - name: Check the OAuth credentials are configured
        if: github.event_name == 'release'
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -z "$GOOGLE_CLIENT_ID" ] || [ -z "$GOOGLE_CLIENT_SECRET" ]; then
            echo "::error::Mancano i secret GOOGLE_CLIENT_ID e GOOGLE_CLIENT_SECRET. Impostali in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Build macOS app
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: pnpm dist:mac

      # `electron-builder.yml` fissa gli artifactName, quindi i percorsi sono
      # deterministici: si verificano invece di cercarli, e se un giorno il maker
      # cambiasse posto il fallimento è esplicito.
      - name: Locate artifacts
        id: artifacts
        run: |
          VERSION="${{ steps.package-version.outputs.version }}"
          ARM64="release/praticaai-reviewer-${VERSION}-mac-arm64.dmg"
          X64="release/praticaai-reviewer-${VERSION}-mac-x64.dmg"
          MISSING=0
          for FILE in "$ARM64" "$X64"; do
            if [ ! -f "$FILE" ]; then
              echo "::error::Artefatto atteso non trovato: $FILE"
              MISSING=1
            fi
          done
          if [ "$MISSING" = "1" ]; then
            echo "Contenuto di release/:"
            find release -maxdepth 1 -type f || true
            exit 1
          fi
          {
            echo "arm64=$ARM64"
            echo "x64=$X64"
            printf 'files<<EOF\n%s\n%s\nEOF\n' "$ARM64" "$X64"
          } >> "$GITHUB_OUTPUT"
          echo "Trovati: $ARM64, $X64"

      - name: Upload artifacts to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.artifacts.outputs.files }}
          fail_on_unmatched_files: true

      # Un artefatto per architettura: in una run manuale GitHub li impacchetta in un
      # unico zip, e mettere insieme arm64 e x64 obbligherebbe a scaricare il doppio
      # per poi usarne metà.
      - name: Upload arm64 artifact for manual runs
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: praticaai-reviewer-${{ steps.package-version.outputs.version }}-mac-arm64
          path: ${{ steps.artifacts.outputs.arm64 }}
          if-no-files-found: error

      - name: Upload x64 artifact for manual runs
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: praticaai-reviewer-${{ steps.package-version.outputs.version }}-mac-x64
          path: ${{ steps.artifacts.outputs.x64 }}
          if-no-files-found: error
