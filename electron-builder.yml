appId: com.praticaai.reviewer
productName: PraticaAI Reviewer
copyright: Carlo Berdondini

directories:
  buildResources: build
  output: release

# Firma ad-hoc del bundle macOS: senza, il pacchetto scaricato risulta danneggiato.
afterPack: build/after-pack.js

files:
  - out/**
  - package.json

# Lo snapshot del registry e i modelli tesseract restano file su disco accanto
# all'app: `src/main/paths.ts` li cerca in `process.resourcesPath` quando è
# impacchettata, e in `resources/` quando gira da sorgente.
extraResources:
  - from: resources/registry
    to: registry
  - from: resources/tessdata
    to: tessdata

# Moduli nativi e worker che devono esistere come file veri: dentro l'archivio asar
# non sono caricabili (il binding .node) o non sono eseguibili (il worker di tesseract).
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
  - '**/node_modules/@napi-rs/canvas*/**'
  - '**/node_modules/tesseract.js/**'
  - '**/node_modules/tesseract.js-core/**'

mac:
  # La piattaforma sta nel nome: senza, lo zip mac x64 e lo zip Windows x64
  # finirebbero sullo stesso file in `release/`.
  artifactName: praticaai-reviewer-${version}-mac-${arch}.${ext}
  # Solo dmg: lo zip su macOS serve agli aggiornamenti automatici di
  # electron-updater, che qui non si usano, e raddoppierebbe il peso della release.
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.business
  darkModeSupport: false

win:
  artifactName: praticaai-reviewer-${version}-win-${arch}.${ext}
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]

nsis:
  artifactName: praticaai-reviewer-${version}-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
